# Override for testing the RPi stack locally (localhost instead of orpheus-networks.com).
# Usage:
#   1. cp docker-compose.rpi.override.example.yml docker-compose.rpi.override.yml
#   2. cp env.rpi.local.example .env.rpi.local  (edit with your DB/JWT/etc.)
#   3. docker compose -f docker-compose.rpi.yml -f docker-compose.rpi.override.yml --env-file .env.rpi.local up --build
# Then open http://localhost (nginx) — same routing as production, but local.
# Leave docker-compose.rpi.override.yml out of git (add to .gitignore).

services:
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default-local.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

  api-service:
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost

  mqt-frontend:
    image: mptt-server-frontend:local
    build:
      context: ./src/production/mqt.frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost
        NEXT_PUBLIC_READINGS_API_BASE_URL: http://localhost
