name: Build and push Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. v1.0.0 or latest)"
        required: true
        default: "latest"

env:
  PROJECT_NAME: mptt-server

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Ingestor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-ingestor:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-ingestor:latest

      - name: Build and push Bridge
        uses: docker/build-push-action@v6
        with:
          context: ./src/production/MQT.Bridge
          file: ./src/production/MQT.Bridge/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-bridge:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-bridge:latest

      - name: Build and push Mosquitto
        uses: docker/build-push-action@v6
        with:
          context: ./src/production/MQT.Mosquitto
          file: ./src/production/MQT.Mosquitto/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-mosquitto:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-mosquitto:latest

      - name: Build and push API Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/production/MQT.ApiService/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-api:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-api:latest

      - name: Build and push Email Service (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/production/MQT.EmailService/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-email:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-email:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./src/production/mqt.frontend
          file: ./src/production/mqt.frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://orpheus-networks.com
            NEXT_PUBLIC_READINGS_API_BASE_URL=https://orpheus-networks.com
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-frontend:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-frontend:latest
