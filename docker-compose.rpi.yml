services:
  # MQTT Broker (Mosquitto) - Production
  mosquitto:
    image: ${DOCKERHUB_USERNAME}/mptt-server-mosquitto:latest
    container_name: mqtt-broker-prod
    env_file:
      - .env.production
    ports:
      - "8883:8883"        # MQTT with TLS
      - "9443:9443"        # WebSocket with TLS
    volumes:
      - mosq-data:/mosquitto/data
      - mosq-logs:/mosquitto/log
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
    environment:
      - TZ=Etc/UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-m", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mqtt-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgresql-prod
    env_file:
      - .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-iot}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-iot}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mqtt-network

  # MQTT Bridge - Forwards messages from external broker to local broker
  mqtt-bridge:
    image: ${DOCKERHUB_USERNAME}/mptt-server-bridge:latest
    container_name: mqtt-bridge-prod
    env_file:
      - .env.production
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      # External Broker Configuration (where your RPi sensors connect)
      - EXTERNAL_BROKER_HOST=${EXTERNAL_BROKER_HOST:-}
      - EXTERNAL_BROKER_PORT=${EXTERNAL_BROKER_PORT:-1883}
      - EXTERNAL_BROKER_USER=${EXTERNAL_BROKER_USER:-}
      - EXTERNAL_BROKER_PASS=${EXTERNAL_BROKER_PASS:-}
      
      # Local Broker Configuration (Docker Mosquitto)
      - LOCAL_BROKER_HOST=mosquitto
      - LOCAL_BROKER_PORT=1883
      - LOCAL_BROKER_USER=${BROKER_USER:-}
      - LOCAL_BROKER_PASS=${BROKER_PASS:-}
      
      # Topic Configuration
      - TOPIC_FILTER=${TOPIC_FILTER:-sensors/#}
      
      # Timezone
      - TZ=Etc/UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('mosquitto', 1883), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mqtt-network

  # MQTT Ingestor Service - Standalone data ingestion
  mqtt-ingestor:
    image: ${DOCKERHUB_USERNAME}/mptt-server-ingestor:latest
    container_name: mqtt-ingestor-prod
    env_file:
      - .env.production
    depends_on:
      - mosquitto
      - api-service
    ports:
      - "9003:9003"        # Health check endpoint
    environment:
      # Health Server
      - INGESTOR_PORT=9003
      
      # API Service Configuration
      - API_SERVICE_URL=http://api-service:9002
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      
      # MQTT Broker Configuration (Production)
      - BROKER_HOST=mosquitto
      - BROKER_PORT=1883
      - BROKER_TLS=${BROKER_TLS:-false}
      - BROKER_USER=${BROKER_USER:-}
      - BROKER_PASS=${BROKER_PASS:-}
      - BROKER_CA_FILE=${BROKER_CA_FILE:-}
      
      # MQTT Subscription Configuration
      - MQTT_TOPIC=${MQTT_TOPIC:-sensors/#}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-mqtt-ingestor-prod}
      - MQTT_SHARED_GROUP=${MQTT_SHARED_GROUP:-}
      
      # Batch Processing Configuration
      - BATCH_SIZE=${BATCH_SIZE:-200}
      - BATCH_WINDOW=${BATCH_WINDOW:-1s}
      
      # Timezone
      - TZ=Etc/UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mqtt-network

  # API Service - REST API with authentication
  api-service:
    image: ${DOCKERHUB_USERNAME}/mptt-server-api:latest
    container_name: api-service-prod
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9002:9002"        # HTTP API endpoint (internal, accessed via Nginx)
    environment:
      # HTTP Server
      - PORT=9002
      
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-iot}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      
      # Service-to-Service Authentication
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      
      # Auth Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=mpt-api-service
      - JWT_ACCESS_TOKEN_DURATION=${JWT_ACCESS_TOKEN_DURATION:-24h}
      - JWT_REFRESH_TOKEN_DURATION=${JWT_REFRESH_TOKEN_DURATION:-168h}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      
      # CORS Configuration - Production domain
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://orpheus-networks.com,https://www.orpheus-networks.com}
      - CORS_ALLOWED_METHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - CORS_ALLOWED_HEADERS=Origin,Content-Type,Accept,Authorization,token
      - CORS_EXPOSED_HEADERS=Content-Length
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_MAX_AGE=43200
      
      # OpenWeather API Configuration
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      
      # Timezone
      - TZ=Etc/UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mqtt-network

  # MQT Frontend - Next.js web application
  mqt-frontend:
    image: ${DOCKERHUB_USERNAME}/mptt-server-frontend:latest
    container_name: mqt-frontend-prod
    env_file:
      - .env.production
    depends_on:
      - api-service
    ports:
      - "3000:3000"        # Internal port (accessed via Nginx)
    environment:
      - TZ=Etc/UTC
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://orpheus-networks.com/api}
      - NEXT_PUBLIC_READINGS_API_BASE_URL=${NEXT_PUBLIC_READINGS_API_BASE_URL:-https://orpheus-networks.com/api}
    restart: unless-stopped
    networks:
      - mqtt-network

volumes:
  mosq-data:
    driver: local
  mosq-logs:
    driver: local
  postgres-data:
    driver: local

networks:
  mqtt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

