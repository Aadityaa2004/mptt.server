server {
    listen 80;
    server_name orpheus-networks.com www.orpheus-networks.com;

    # Let's Encrypt HTTP-01 challenge (safe even if you don't use SSL yet)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Service Proxy (no SSL - Cloudflare Tunnel handles TLS at the edge)
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api-service:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # MQTT over WebSockets (proxied to Mosquitto)
    # External clients connect via: wss://orpheus-networks.com/mqtt
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Frontend Proxy (no SSL - Cloudflare Tunnel handles TLS at the edge)
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://mqt-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        proxy_pass http://api-service:9002/health;
        proxy_set_header Host $host;
    }
}

